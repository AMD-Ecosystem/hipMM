[build-system]
build-backend = "rapids_build_backend.build"
requires = [
    "rapids-build-backend>=0.4.0,<0.5.0",
    "scikit-build-core[pyproject]>=0.11.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project]
name = "amd-libhipmm"
dynamic = ["version"]
description = "hipMM - HIP Memory Manager"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
# NOTE(HIP/AMD): AMD ships librmm as a dual-licensed (Apache-2.0 AND MIT)
# package. Expressed in PEP 639 SPDX form to match upstream's adoption of the
# new license-field convention.
license = "Apache-2.0 AND MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Programming Language :: C++",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: AMD ROCm"
]
dependencies = [
# <<<<<<< OLD CODE from ca529c1e (9af4dc2e) - COMMENTED OUT
#     # NOTE(HIP/AMD): AMD ships its own logger (`amd-rocmds-logger`), the
#     # ROCm-DS packaging of upstream's `rapids-logger`. Keep AMD package name.
#     "amd-rocmds-logger==1.0.*",
# =======
    "rapids-logger==0.2.*",
# >>>>>>> END NEW CODE (9af4dc2e)
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project.urls]
Homepage = "https://github.com/rocm/hipmm"

[project.entry-points."cmake.prefix"]
librmm = "librmm"

[tool.rapids-build-backend]
build-backend = "scikit_build_core.build"
commit-files = [
  "librmm/COMMIT"
]
dependencies-file = "../../dependencies.yaml"
matrix-entry = "cuda_suffixed=true"
requires = [
    "cmake>=3.30.4",
    "ninja",
# <<<<<<< OLD CODE from ca529c1e (9af4dc2e) - COMMENTED OUT
#     # NOTE(HIP/AMD): AMD ROCm-DS-packaged logger; see project.dependencies above.
#     "amd-rocmds-logger==1.0.*",
# =======
    "rapids-logger==0.2.*",
# >>>>>>> END NEW CODE (9af4dc2e)
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.reproducible = true
wheel.packages = ["librmm"]
wheel.install-dir = "librmm"
wheel.py-api = "py3"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "librmm/VERSION"
regex = "(?P<value>.*)"

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI hard limit is 1GiB, but try to keep this as small as possible
max_allowed_size_compressed = '15Mi'
