[build-system]
build-backend = "rapids_build_backend.build"
requires = [
    "rapids-build-backend>=0.4.0,<0.5.0",
    "scikit-build-core[pyproject]>=0.11.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project]
name = "amd-hipmm"
dynamic = ["version"]
description = "hipMM - Memory Manager for AMD GPUs"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
# NOTE(HIP/AMD): AMD ships rmm as a dual-licensed (Apache-2.0 AND MIT)
# package. Expressed in PEP 639 SPDX form to match upstream's adoption of the
# new license-field convention.
license = "Apache-2.0 AND MIT"
requires-python = ">=3.10"
dependencies = [
    "hip-python-interop>=7.2.3",
    "rocm-bindings-hip>=7.2.3",
    "amd-libhipmm==5.0.*,>=0.0.0a0",
    "numpy>=1.23,<3.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = [
    # NOTE(HIP/AMD): use numba-hip (the AMD numba backend) instead of upstream
    # numba-cuda. This matches the import substitution in
    # `python/rmm/rmm/allocators/numba.py` (`from numba import hip as cuda`).
    "numba-hip>=0.1.6",
    "numba>=0.60.0,<0.62.0",
    "packaging",
    "pytest-cov",
    "pytest<9.0.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project.urls]
Homepage = "https://github.com/ROCm-DS/hipMM"

[tool.isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
order_by_type = true
known_first_party = [
    "rmm",
]
default_section = "THIRDPARTY"
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
skip = [
    "thirdparty",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "__init__.py",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.exclude = ["*tests*"]
sdist.reproducible = true
wheel.packages = ["rmm", "hipmm"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "rmm/VERSION"
regex = "(?P<value>.*)"

[tool.rapids-build-backend]
build-backend = "scikit_build_core.build"
dependencies-file = "../../dependencies.yaml"
commit-files = [
  "rmm/COMMIT"
]
matrix-entry = "cuda_suffixed=true"
requires = [
    "cmake>=3.30.4",
    # NOTE(HIP/AMD): substitute upstream `cuda-python` and `librmm` with their
    # AMD equivalents (`hip-python` + `hip-python-as-cuda`, `amd-libhipmm`),
    # bumped to AMD semantic version 5.x. Adopt new cython upper bound from
    # upstream.
    "hip-python-as-cuda>=7.0.0",
    "hip-python>=7.0.0",
    "amd-libhipmm==5.*,>=5.0.0a0",
    "cython>=3.0.0,<3.2.0",
    "ninja",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI limit is 100 MiB, fail CI before we get too close to that
max_allowed_size_compressed = '75M'

[tool.pytest.ini_options]
# treat warnings as errors
filterwarnings = [
    "error",
    "ignore:The cuda.core.experimental namespace is deprecated:DeprecationWarning",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["rmm"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
